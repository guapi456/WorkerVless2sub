name = "yg-sub-worker"
main = "_worker.js"
compatibility_date = "2025-09-07"
keep_vars = true

[vars]
# 快速订阅入口路径 /auto
TOKEN = "auto"
# VLESS 服务端伪装域名（使用自有域名，避免 workers.dev SNI 被重置）
HOST = "node.145156.xyz"
# 订阅内置 VLESS 节点 UUID
UUID = "c22d869c-3a2d-484f-9546-8126c5bd3144"
# WS 路径
PATH = "/?ed=2560"
# 本机真实 VLESS+WS+TLS+带宽筛选源
ADDAPI = "https://raw.githubusercontent.com/guapi456/WorkerVless2sub/main/yg-cf-ips.txt"
ADDCSV = ""
DLS = "5"
# 订阅转换后端与配置
SUBAPI = "subapi.cmliussss.net"
SUBCONFIG = "https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/config/ACL4SSR_Online_Full_MultiMode.ini"
SUBNAME = "YG-优选订阅"
